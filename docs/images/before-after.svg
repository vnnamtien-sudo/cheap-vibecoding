<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" font-family="system-ui,sans-serif">
<rect width="760" height="388" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">未调整（9/14–10/2） vs 现在（11/17–11/18）</text><text x="24" y="56" font-size="12.5" fill="#52514e">同一台工作站、同一个统计脚本，越短越好</text><rect x="24" y="70" width="12" height="12" fill="#a9a8a2"/><text x="42" y="80" font-size="12" fill="#52514e">未调整</text><rect x="174" y="70" width="12" height="12" fill="#2a78d6"/><text x="192" y="80" font-size="12" fill="#52514e">现在</text><text x="24" y="118" font-size="13" fill="#1a1a19">每一步花费（美分）</text><text x="24" y="138" font-size="12.5" fill="#52514e" font-weight="700">−45%</text><rect x="330" y="104" width="360" height="14" fill="#a9a8a2"/><text x="698" y="116" font-size="12.5" fill="#52514e">10.5</text><rect x="330" y="122" width="198.857" height="14" fill="#2a78d6"/><text x="536.857" y="134" font-size="12.5" fill="#1a1a19">5.8</text><text x="24" y="180" font-size="13" fill="#1a1a19">每一步新读入（千 token）</text><text x="24" y="200" font-size="12.5" fill="#52514e" font-weight="700">−42%</text><rect x="330" y="166" width="360" height="14" fill="#a9a8a2"/><text x="698" y="178" font-size="12.5" fill="#52514e">3.67</text><rect x="330" y="184" width="209.918" height="14" fill="#2a78d6"/><text x="547.918" y="196" font-size="12.5" fill="#1a1a19">2.14</text><text x="24" y="242" font-size="13" fill="#1a1a19">整份读文件的占比（%）</text><text x="24" y="262" font-size="12.5" fill="#52514e" font-weight="700">−55%</text><rect x="330" y="228" width="360" height="14" fill="#a9a8a2"/><text x="698" y="240" font-size="12.5" fill="#52514e">51</text><rect x="330" y="246" width="162.353" height="14" fill="#2a78d6"/><text x="500.353" y="258" font-size="12.5" fill="#1a1a19">23</text><text x="24" y="304" font-size="13" fill="#1a1a19">上下文超 25 万的会话（%）</text><text x="24" y="324" font-size="12.5" fill="#52514e" font-weight="700">−82%</text><rect x="330" y="290" width="360" height="14" fill="#a9a8a2"/><text x="698" y="302" font-size="12.5" fill="#52514e">33</text><rect x="330" y="308" width="65.4545" height="14" fill="#2a78d6"/><text x="403.455" y="320" font-size="12.5" fill="#1a1a19">6</text><text x="24" y="370" font-size="11.5" fill="#8a8984">“现在”只有约一天半，满 7 天后更新；口径和局限见数据报告。</text>
</svg>
