<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="394" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">Codex 那边也一样吗：用得最多的一天 vs 11/15</text><text x="24" y="56" font-size="12.5" fill="#52514e">Claude 最多是 10/8，Codex 最多是 10/31（本机有记录的日子里）。</text><rect x="24" y="70" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="42" y="80" font-size="12" fill="#52514e">用得最多的一天</text><rect x="174" y="70" width="12" height="12" rx="3" fill="#2a78d6"/><text x="192" y="80" font-size="12" fill="#52514e">11/15</text><text x="24" y="118" font-size="13" fill="#1a1a19">Claude 每步重读前文（万 token）</text><text x="24" y="138" font-size="12.5" fill="#52514e" font-weight="700">−45%</text><path d="M330,104H686q4,0 4,4V114q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="116" font-size="12.5" fill="#52514e">38</text><path d="M330,122H523.0q4,0 4,4V132q0,4 -4,4H330Z" fill="#2a78d6"/><text x="535.0" y="134" font-size="12.5" fill="#1a1a19">20.8</text><text x="24" y="180" font-size="13" fill="#1a1a19">Codex 每步重读前文（万 token）</text><text x="24" y="200" font-size="12.5" fill="#52514e" font-weight="700">+35%</text><path d="M330,166H592.0q4,0 4,4V176q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="604.0" y="178" font-size="12.5" fill="#52514e">15.3</text><path d="M330,184H686q4,0 4,4V194q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="196" font-size="12.5" fill="#1a1a19">20.7</text><text x="24" y="242" font-size="13" fill="#1a1a19">Claude 整份读文件（%）</text><text x="24" y="262" font-size="12.5" fill="#52514e" font-weight="700">−42 点</text><path d="M330,228H686q4,0 4,4V238q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="240" font-size="12.5" fill="#52514e">57</text><path d="M330,246H420.7q4,0 4,4V256q0,4 -4,4H330Z" fill="#2a78d6"/><text x="432.7" y="258" font-size="12.5" fill="#1a1a19">15</text><text x="24" y="304" font-size="13" fill="#1a1a19">Codex 整份读文件（%）</text><text x="24" y="324" font-size="12.5" fill="#52514e" font-weight="700">−12 点</text><path d="M330,290H686q4,0 4,4V300q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="302" font-size="12.5" fill="#52514e">22</text><path d="M330,308H489.6q4,0 4,4V318q0,4 -4,4H330Z" fill="#2a78d6"/><text x="501.6" y="320" font-size="12.5" fill="#1a1a19">10</text><text x="24" y="380" font-size="11.5" fill="#8a8984">量这组数时两个钩子只装在 Claude 上；Codex 本机记录约是官方用量页的七成，只比趋势。</text>
</svg>
