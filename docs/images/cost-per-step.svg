<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">每一步（一次工具调用）平均花多少美分</text><text x="24" y="56" font-size="12.5" fill="#52514e">从最早没调整到现在 −39%</text><line x1="30" y1="270" x2="740" y2="270" stroke="#e4e3de"/><path d="M40,270V106q0,-4 4,-4h64q4,0 4,4V270Z" fill="#a9a8a2"/><text x="76" y="94" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">10.5</text><text x="76" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">最早没调整</text><text x="76" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">9/14–10/2</text><path d="M156,270V117.1q0,-4 4,-4h64q4,0 4,4V270Z" fill="#8db6e8"/><text x="192" y="105.1" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">9.8</text><text x="192" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">全开最高档</text><text x="192" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">10/3–10/12</text><path d="M272,270V115.6q0,-4 4,-4h64q4,0 4,4V270Z" fill="#8db6e8"/><text x="308" y="103.6" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">9.9</text><text x="308" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">降档+程序先查</text><text x="308" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">10/13–11/4</text><path d="M388,270V126.8q0,-4 4,-4h64q4,0 4,4V270Z" fill="#8db6e8"/><text x="424" y="114.8" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">9.2</text><text x="424" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">一事一对话</text><text x="424" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">11/5–11/10</text><path d="M504,270V154q0,-4 4,-4h64q4,0 4,4V270Z" fill="#8db6e8"/><text x="540" y="142" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">7.5</text><text x="540" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">只用高两档</text><text x="540" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">11/10–11/11</text><path d="M620,270V171.6q0,-4 4,-4h64q4,0 4,4V270Z" fill="#2a78d6"/><text x="656" y="159.6" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">6.4</text><text x="656" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">源头限读</text><text x="656" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">11/11–11/16</text><text x="24" y="346" font-size="11.5" fill="#8a8984">每段是一次改规矩之后的那几天；花费按估算价目算（见数据报告“口径”），不是账单。</text>
