<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="700" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">Baseline (Sep 14–Oct 2) vs now (Nov 11 night–Nov 16)</text><text x="24" y="56" font-size="12.5" fill="#52514e">Good and bad both shown. Idle hours are not counted as working hours.</text><rect x="24" y="70" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="42" y="80" font-size="12" fill="#52514e">Baseline</text><rect x="174" y="70" width="12" height="12" rx="3" fill="#2a78d6"/><text x="192" y="80" font-size="12" fill="#52514e">Now</text><text x="24" y="118" font-size="14.5" fill="#1a1a19" font-weight="700">Better</text><text x="24" y="152" font-size="13" fill="#1a1a19">Cost per step (cents)</text><text x="24" y="172" font-size="12.5" fill="#52514e" font-weight="700">−39%</text><path d="M330,138H686q4,0 4,4V148q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="150" font-size="12.5" fill="#52514e">10.5</text><path d="M330,156H545.4q4,0 4,4V166q0,4 -4,4H330Z" fill="#2a78d6"/><text x="557.4" y="168" font-size="12.5" fill="#1a1a19">6.4</text><text x="24" y="214" font-size="13" fill="#1a1a19">Fresh input per step (k tokens)</text><text x="24" y="234" font-size="12.5" fill="#52514e" font-weight="700">−43%</text><path d="M330,200H686q4,0 4,4V210q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="212" font-size="12.5" fill="#52514e">3.67</text><path d="M330,218H530.0q4,0 4,4V228q0,4 -4,4H330Z" fill="#2a78d6"/><text x="542.0" y="230" font-size="12.5" fill="#1a1a19">2.08</text><text x="24" y="276" font-size="13" fill="#1a1a19">Whole-file reads (%)</text><text x="24" y="296" font-size="12.5" fill="#52514e" font-weight="700">−35 pts</text><path d="M330,262H686q4,0 4,4V272q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="274" font-size="12.5" fill="#52514e">51</text><path d="M330,280H438.9q4,0 4,4V290q0,4 -4,4H330Z" fill="#2a78d6"/><text x="450.9" y="292" font-size="12.5" fill="#1a1a19">16</text><text x="24" y="338" font-size="13" fill="#1a1a19">Deliveries per working hour</text><text x="24" y="358" font-size="12.5" fill="#52514e" font-weight="700">+74%</text><path d="M330,324H532.6q4,0 4,4V334q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="544.6" y="336" font-size="12.5" fill="#52514e">3.1</text><path d="M330,342H686q4,0 4,4V352q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="354" font-size="12.5" fill="#1a1a19">5.4</text><text x="24" y="400" font-size="14.5" fill="#1a1a19" font-weight="700">Worse</text><text x="24" y="434" font-size="13" fill="#1a1a19">Cost per delivery (USD)</text><text x="24" y="454" font-size="12.5" fill="#52514e" font-weight="700">+19%</text><path d="M330,420H629.3q4,0 4,4V430q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="641.3" y="432" font-size="12.5" fill="#52514e">16.6</text><path d="M330,438H686q4,0 4,4V448q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="450" font-size="12.5" fill="#1a1a19">19.7</text><text x="24" y="496" font-size="13" fill="#1a1a19">Code chars written per USD</text><text x="24" y="516" font-size="12.5" fill="#52514e" font-weight="700">−21%</text><path d="M330,482H686q4,0 4,4V492q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="494" font-size="12.5" fill="#52514e">2,020</text><path d="M330,500H609.0q4,0 4,4V510q0,4 -4,4H330Z" fill="#2a78d6"/><text x="621.0" y="512" font-size="12.5" fill="#1a1a19">1,588</text><text x="24" y="558" font-size="13" fill="#1a1a19">Subagent share of spend (%)</text><text x="24" y="578" font-size="12.5" fill="#52514e" font-weight="700">+27 pts</text><path d="M330,544H465.0q4,0 4,4V554q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="477.0" y="556" font-size="12.5" fill="#52514e">17</text><path d="M330,562H686q4,0 4,4V572q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="574" font-size="12.5" fill="#1a1a19">44</text><text x="24" y="620" font-size="13" fill="#1a1a19">Sessions over 250k context (%)</text><text x="24" y="640" font-size="12.5" fill="#52514e" font-weight="700">+10 pts</text><path d="M330,606H602.2q4,0 4,4V616q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="614.2" y="618" font-size="12.5" fill="#52514e">33</text><path d="M330,624H686q4,0 4,4V634q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="636" font-size="12.5" fill="#1a1a19">43</text><text x="24" y="686" font-size="11.5" fill="#8a8984">Each row has its own scale; compare only the two bars in a row. Data: all sessions on one machine, each reply counted once.</text>
