<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">Does Codex behave the same? Busiest day vs Nov 15</text><text x="24" y="56" font-size="12.5" fill="#52514e">Busiest day: Claude Oct 8, Codex Oct 31 (among days with local logs).</text><rect x="24" y="70" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="42" y="80" font-size="12" fill="#52514e">Busiest day</text><rect x="174" y="70" width="12" height="12" rx="3" fill="#2a78d6"/><text x="192" y="80" font-size="12" fill="#52514e">Nov 15</text><text x="24" y="118" font-size="13" fill="#1a1a19">Claude: prior context re-read per step (k)</text><text x="24" y="138" font-size="12.5" fill="#52514e" font-weight="700">−45%</text><path d="M330,104H686q4,0 4,4V114q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="116" font-size="12.5" fill="#52514e">380</text><path d="M330,122H523.0q4,0 4,4V132q0,4 -4,4H330Z" fill="#2a78d6"/><text x="535.0" y="134" font-size="12.5" fill="#1a1a19">208</text><text x="24" y="180" font-size="13" fill="#1a1a19">Codex: prior context re-read per step (k)</text><text x="24" y="200" font-size="12.5" fill="#52514e" font-weight="700">+35%</text><path d="M330,166H592.0q4,0 4,4V176q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="604.0" y="178" font-size="12.5" fill="#52514e">153</text><path d="M330,184H686q4,0 4,4V194q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="196" font-size="12.5" fill="#1a1a19">207</text><text x="24" y="242" font-size="13" fill="#1a1a19">Claude: whole-file reads (%)</text><text x="24" y="262" font-size="12.5" fill="#52514e" font-weight="700">−42 pts</text><path d="M330,228H686q4,0 4,4V238q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="240" font-size="12.5" fill="#52514e">57</text><path d="M330,246H420.7q4,0 4,4V256q0,4 -4,4H330Z" fill="#2a78d6"/><text x="432.7" y="258" font-size="12.5" fill="#1a1a19">15</text><text x="24" y="304" font-size="13" fill="#1a1a19">Codex: whole-file reads (%)</text><text x="24" y="324" font-size="12.5" fill="#52514e" font-weight="700">−12 pts</text><path d="M330,290H686q4,0 4,4V300q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="302" font-size="12.5" fill="#52514e">22</text><path d="M330,308H489.6q4,0 4,4V318q0,4 -4,4H330Z" fill="#2a78d6"/><text x="501.6" y="320" font-size="12.5" fill="#1a1a19">10</text><text x="24" y="380" font-size="11.5" fill="#8a8984">When measured, the two hooks were only on Claude. Codex local logs are ~70% of its usage page: compare trends only.</text>
</svg>
