xt-anchor="middle">Nov 10–11</text><path d="M620,270V171.6q0,-4 4,-4h64q4,0 4,4V270Z" fill="#2a78d6"/><text x="656" y="159.6" font-size="15" fill="#1a1a19" text-anchor="middle" font-weight="700">6.4</text><text x="656" y="290" font-size="12.5" fill="#1a1a19" text-anchor="middle">Read limits</text><text x="656" y="308" font-size="11.5" fill="#8a8984" text-anchor="middle">Nov 11–16</text><text x="24" y="346" font-size="11.5" fill="#8a8984">Each bar covers the days after one rule change. Costs are estimates from a price table (see Methodology), not invoices.</text>
