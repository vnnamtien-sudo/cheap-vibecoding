<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="system-ui,sans-serif">
<rect width="760" height="370" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">Every step re-reads the whole conversation</text><text x="24" y="56" font-size="12.5" fill="#52514e">Where the tokens go, across every Claude Code session log on one workstation</text><rect x="30" y="76" width="693" height="30" fill="#a9a8a2"/><rect x="723" y="76" width="7" height="30" fill="#2a78d6"/><text x="30" y="126" font-size="13" fill="#52514e">Re-reading prior context ≈ 98–99%</text><text x="730" y="126" font-size="13" fill="#2a78d6" text-anchor="end">New input + output ≈ 1–2%</text><text x="380" y="174" font-size="20" fill="#1a1a19" font-weight="700" text-anchor="middle">Cost ≈ context per step × steps × price</text><rect x="24" y="196" width="228" height="124" fill="#f3f2ee"/><text x="38" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">① Context per step</text><text x="38" y="250" font-size="12.5" fill="#52514e">Short, stable rules</text><text x="38" y="274" font-size="12.5" fill="#52514e">Search, then read ≤60 lines</text><text x="38" y="298" font-size="12.5" fill="#52514e">Compact at ~250k tokens</text><rect x="266" y="196" width="228" height="124" fill="#f3f2ee"/><text x="280" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">② Steps</text><text x="280" y="250" font-size="12.5" fill="#52514e">One task, one conversation</text><text x="280" y="274" font-size="12.5" fill="#52514e">Self-check before review</text><text x="280" y="298" font-size="12.5" fill="#52514e">Fewer subagents and sessions</text><rect x="508" y="196" width="228" height="124" fill="#f3f2ee"/><text x="522" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">③ Price</text><text x="522" y="250" font-size="12.5" fill="#52514e">high for daily work</text><text x="522" y="274" font-size="12.5" fill="#52514e">xhigh only for final checks</text><text x="522" y="298" font-size="12.5" fill="#52514e">Light model for read-only</text><text x="24" y="352" font-size="11.5" fill="#8a8984">Data: Claude Code session logs from one workstation, 2026-09-14 to 11-18, counted with tools/stages.py</text>
</svg>
