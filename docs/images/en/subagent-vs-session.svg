<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="300" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">One subagent run vs one fresh session (Nov 11 night–Nov 16)</text><rect x="24" y="54" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="64" font-size="12" fill="#52514e">Subagent</text><rect x="174" y="54" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="192" y="64" font-size="12" fill="#52514e">Fresh session</text><text x="24" y="102" font-size="13" fill="#1a1a19">Average cost per run (USD)</text><path d="M330,88H531.7q4,0 4,4V98q0,4 -4,4H330Z" fill="#2a78d6"/><text x="543.7" y="100" font-size="12.5" fill="#52514e">5.2</text><path d="M330,106H686q4,0 4,4V116q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="118" font-size="12.5" fill="#1a1a19">9.1</text><text x="24" y="154" font-size="13" fill="#1a1a19">Context read at start (k tokens)</text><path d="M330,140H571.4q4,0 4,4V150q0,4 -4,4H330Z" fill="#2a78d6"/><text x="583.4" y="152" font-size="12.5" fill="#52514e">75</text><path d="M330,158H686q4,0 4,4V168q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="170" font-size="12.5" fill="#1a1a19">110</text><text x="24" y="206" font-size="13" fill="#1a1a19">How many were started</text><path d="M330,192H686q4,0 4,4V202q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="204" font-size="12.5" fill="#52514e">916</text><path d="M330,210H583.8q4,0 4,4V220q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="595.8" y="222" font-size="12.5" fill="#1a1a19">656</text><text x="24" y="268" font-size="13" fill="#1a1a19">Per run, a subagent is cheaper. We overspent because we spawned too many (916 in ~4 days, $4,722).</text><text x="24" y="288" font-size="13" fill="#1a1a19">To save: spawn fewer; do small lookups yourself by line range. Each row has its own scale.</text>
</svg>
