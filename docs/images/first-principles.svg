<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="system-ui,sans-serif">
<rect width="760" height="370" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">每一步都要把整段对话重读一遍</text><text x="24" y="56" font-size="12.5" fill="#52514e">一台工作站全部 Claude Code 会话记录里，token 花在哪</text><rect x="30" y="76" width="693" height="30" fill="#a9a8a2"/><rect x="723" y="76" width="7" height="30" fill="#2a78d6"/><text x="30" y="126" font-size="13" fill="#52514e">重读前文 ≈ 98–99%</text><text x="730" y="126" font-size="13" fill="#2a78d6" text-anchor="end">新读入 + 写出 ≈ 1–2%</text><text x="380" y="174" font-size="20" fill="#1a1a19" font-weight="700" text-anchor="middle">花费 ≈ 每步上下文 × 步数 × 单价</text><rect x="24" y="196" width="228" height="124" fill="#f3f2ee"/><text x="38" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">① 每步上下文</text><text x="38" y="250" font-size="12.5" fill="#52514e">规矩写短、少改</text><text x="38" y="274" font-size="12.5" fill="#52514e">先搜再读，每次 ≤60 行</text><text x="38" y="298" font-size="12.5" fill="#52514e">到约 25 万就压缩</text><rect x="266" y="196" width="228" height="124" fill="#f3f2ee"/><text x="280" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">② 步数</text><text x="280" y="250" font-size="12.5" fill="#52514e">一件事一个对话</text><text x="280" y="274" font-size="12.5" fill="#52514e">交验收前先跑自检</text><text x="280" y="298" font-size="12.5" fill="#52514e">少开子代理和新会话</text><rect x="508" y="196" width="228" height="124" fill="#f3f2ee"/><text x="522" y="222" font-size="14.5" fill="#1a1a19" font-weight="700">③ 单价</text><text x="522" y="250" font-size="12.5" fill="#52514e">日常用 high</text><text x="522" y="274" font-size="12.5" fill="#52514e">xhigh 只给最终验收</text><text x="522" y="298" font-size="12.5" fill="#52514e">只读用轻量型号</text><text x="24" y="352" font-size="11.5" fill="#8a8984">数据：一台工作站 2026-09-14 至 11-18 的会话记录，统计脚本 tools/stages.py</text>
</svg>
