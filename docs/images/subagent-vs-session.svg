<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="300" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">一次子代理 vs 一个新会话（11/11 夜–11/16）</text><text x="24" y="56" font-size="12.5" fill="#52514e">Per run: a subagent costs less than a fresh session. The bill grew because we spawned too many.</text><rect x="24" y="72" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="82" font-size="12" fill="#52514e">子代理</text><rect x="154" y="72" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="172" y="82" font-size="12" fill="#52514e">新会话</text><text x="24" y="126" font-size="13" fill="#1a1a19">每次平均花费（美元）</text><path d="M300,108H513.1q4,0 4,4V118q0,4 -4,4H300Z" fill="#2a78d6"/><text x="525.1" y="120" font-size="12.5" fill="#1a1a19">5.2</text><path d="M300,126H676q4,0 4,4V136q0,4 -4,4H300Z" fill="#a9a8a2"/><text x="688" y="138" font-size="12.5" fill="#52514e">9.1</text><text x="24" y="178" font-size="13" fill="#1a1a19">开张先读进来的量（千 token）</text><path d="M300,160H555.0q4,0 4,4V170q0,4 -4,4H300Z" fill="#2a78d6"/><text x="567.0" y="172" font-size="12.5" fill="#1a1a19">75</text><path d="M300,178H676q4,0 4,4V188q0,4 -4,4H300Z" fill="#a9a8a2"/><text x="688" y="190" font-size="12.5" fill="#52514e">110</text><text x="24" y="230" font-size="13" fill="#1a1a19">这几天开了多少次</text><path d="M300,212H676q4,0 4,4V222q0,4 -4,4H300Z" fill="#2a78d6"/><text x="688" y="224" font-size="12.5" fill="#1a1a19">916</text><path d="M300,230H568.1q4,0 4,4V240q0,4 -4,4H300Z" fill="#a9a8a2"/><text x="580.1" y="242" font-size="12.5" fill="#52514e">656</text><text x="24" y="278" font-size="13" fill="#1a1a19">结论：单价子代理便宜，费钱在于派得太多（4 天多 916 次、4,722 美元）。要省靠“少开”：</text><text x="24" y="298" font-size="13" fill="#1a1a19">小的查找自己按行读，非开不可的才开。每行各用自己的刻度。</text>
</svg>
