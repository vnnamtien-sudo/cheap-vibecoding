<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="300" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">一次子代理 vs 一个新会话（11/11 夜–11/16）</text><rect x="24" y="54" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="64" font-size="12" fill="#52514e">子代理</text><rect x="174" y="54" width="12" height="12" rx="3" fill="#a9a8a2"/><text x="192" y="64" font-size="12" fill="#52514e">新会话</text><text x="24" y="102" font-size="13" fill="#1a1a19">每次平均花费（美元）</text><path d="M330,88H531.7q4,0 4,4V98q0,4 -4,4H330Z" fill="#2a78d6"/><text x="543.7" y="100" font-size="12.5" fill="#52514e">5.2</text><path d="M330,106H686q4,0 4,4V116q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="118" font-size="12.5" fill="#1a1a19">9.1</text><text x="24" y="154" font-size="13" fill="#1a1a19">开张先读进来的量（千 token）</text><path d="M330,140H571.4q4,0 4,4V150q0,4 -4,4H330Z" fill="#2a78d6"/><text x="583.4" y="152" font-size="12.5" fill="#52514e">75</text><path d="M330,158H686q4,0 4,4V168q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="698" y="170" font-size="12.5" fill="#1a1a19">110</text><text x="24" y="206" font-size="13" fill="#1a1a19">这几天开了多少次</text><path d="M330,192H686q4,0 4,4V202q0,4 -4,4H330Z" fill="#2a78d6"/><text x="698" y="204" font-size="12.5" fill="#52514e">916</text><path d="M330,210H583.8q4,0 4,4V220q0,4 -4,4H330Z" fill="#a9a8a2"/><text x="595.8" y="222" font-size="12.5" fill="#1a1a19">656</text><text x="24" y="268" font-size="13" fill="#1a1a19">结论：单价子代理便宜，费钱在于派得太多（4 天多 916 次、4,722 美元）。要省靠“少开”：</text><text x="24" y="288" font-size="13" fill="#1a1a19">小的查找自己按行读，非开不可的才开。每行各用自己的刻度。</text>
</svg>
