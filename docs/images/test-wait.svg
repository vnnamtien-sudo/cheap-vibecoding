<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif">
<rect width="760" height="330" rx="12" fill="#ffffff"/>
<text x="24" y="34" font-size="18" fill="#1a1a19" font-weight="700">测试超过 10 分钟的 716 次里，67% 是在排队</text><text x="24" y="56" font-size="12.5" fill="#52514e">11/11–11/16 一共 4,212 次测试。</text><rect x="30" y="84" width="466.2" height="34" fill="#2a78d6"/><text x="36" y="140" font-size="13" fill="#1a1a19">排队等位 479 次</text><text x="36" y="158" font-size="12.5" fill="#52514e" font-weight="700">67%</text><rect x="498.2" y="84" width="121.1" height="34" fill="#eb6834"/><text x="504.2" y="140" font-size="13" fill="#1a1a19">真跑得慢 126 次</text><text x="504.2" y="158" font-size="12.5" fill="#52514e" font-weight="700">18%</text><rect x="621.4" y="84" width="106.5" height="34" fill="#c9a227"/><text x="627.4" y="140" font-size="13" fill="#1a1a19">两者叠加 111 次</text><text x="627.4" y="158" font-size="12.5" fill="#52514e" font-weight="700">16%</text><text x="24" y="200" font-size="13" fill="#1a1a19">为什么排队：测试位一度从 8 减到 4（8 份同时跑内存不够，把正在用的服务挤卡），某晚还临时减到 1；</text><text x="24" y="220" font-size="13" fill="#1a1a19">二十来路会话同时要测试，于是排长队。真跑慢的主要是合并、验收时跑整套（中位约 19 分钟，最长 74 分钟）。</text><text x="24" y="252" font-size="13.5" fill="#1a1a19" font-weight="700">对策（v70）：</text><text x="24" y="274" font-size="13" fill="#1a1a19">① 会话和测试共用一个总池（20 位）  ② 整套只准合并 / 验收跑、最多 2 份，开发只跑点到的测试</text><text x="24" y="294" font-size="13" fill="#1a1a19">③ 单次满 15 分钟熔断  ④ 空闲内存不够不放新测试。11/19 复量效果后补进数据报告。</text><text x="24" y="318" font-size="11.5" fill="#8a8984">来源：测试排队器的运行记录（runs.jsonl）。</text>
</svg>
